<div class="container">
<div class="nav">
<button onclick="tab('books',this)">Books</button>
<button id="addBtn" onclick="tab('add',this)">Add Book</button>
<button id="lendBtn" onclick="tab('lend',this)">Lending Book</button>

<button id="deleteBtn" onclick="tab('delete',this)">Delete Details</button>
<button onclick="exportCSV()">Export CSV</button>

</div>

<div id="books" class="tab">
<h2>Search Books</h2>
<input id="search" placeholder="Search Book / Author / ID" onkeyup="showBooks()">
<table id="bookTable"></table>
</div>

<div id="add" class="tab hide">
<h2>Add Book</h2>
<input id="title" placeholder="Book Name">
<input id="bookid" placeholder="Book ID">
<input id="author" placeholder="Author Name">
<input id="isbn" placeholder="ISBN">
<select id="category"><option>Human Geography</option><option>GIS & Remote Sensing</option><option>Environmental Science</option><option>Cartography</option><option>Physical Geography</option><option>English Club Books</option><option>Other</option><option>ERF (Restricted)</option></select>
<input id="year" placeholder="Publication Year">
<input id="publisher" placeholder="Publisher">
<select id="status"><option>Available</option><option>Reference Only</option></select>
<textarea id="description" placeholder="Description"></textarea>
<button onclick="addBook()">Save Book</button>
</div>

<div id="lend" class="tab hide">
<h2>Lending Management</h2>
<input id="lendId" placeholder="Book ID">
<input id="student" placeholder="Student Name">
<input id="studentId" placeholder="Student ID">
<input id="due" type="date">
<button onclick="issueBook()">Issue Book</button>
<table id="loanTable"></table>
</div>

<div id="delete" class="tab hide">
<h2>Delete Details</h2>
<input id="delId" placeholder="Book ID">
<button onclick="deleteBook()">Delete Book</button>
</div>
</div></div>

<script>
let admin=false;
let books=JSON.parse(localStorage.books||"[]");
let loans=JSON.parse(localStorage.loans||"[]");

// Clear previous demo records
if(!localStorage.getItem("ruhuna_system_reset")){
 localStorage.removeItem("books");
 localStorage.removeItem("loans");
 localStorage.setItem("ruhuna_system_reset","yes");
}

// Remove unwanted book record
let removeBookName = "සුනාමි සහ වෙනත් ස්වාභාවික උපද්‍රව";
books = books.filter(b => b.title !== removeBookName);
localStorage.books = JSON.stringify(books);



function login(){
let u=user.value,p=pass.value;
if(u=="Geo_Lib"&&p=="Adm_geo")admin=true;
else if(u=="UserGeo"&&p=="Geo_123")admin=false;
else return alert("Wrong Login");
loginPage.style.display="none";system.classList.remove("hide");
addBtn.style.display=admin?"block":"none";
lendBtn.style.display=admin?"block":"none";
deleteBtn.style.display=admin?"block":"none";
showBooks();
}

function tab(id,b){
document.querySelectorAll(".tab").forEach(x=>x.classList.add("hide"));
document.getElementById(id).classList.remove("hide");
document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));
if(b)b.classList.add("active");

if(id=="lend") showLoans();
}

function addBook(){
books.push({title:title.value,id:bookid.value,author:author.value,isbn:isbn.value,category:category.value,year:year.value,publisher:publisher.value,status:status.value,description:description.value});
localStorage.books=JSON.stringify(books);showBooks();alert("Added");
}

function showBooks(){
let s=search.value.toLowerCase();
let t="<tr><th>Book Name</th><th>Book ID</th><th>Author</th><th>Category</th><th>Status</th></tr>";
books.filter(b=>JSON.stringify(b).toLowerCase().includes(s)).forEach(b=>t+=`<tr><td>${b.title}</td><td>${b.id}</td><td>${b.author}</td><td>${b.category}</td><td>${b.status}</td></tr>`);
bookTable.innerHTML=t;
}

function issueBook(){
let b=books.find(x=>x.id==lendId.value);
if(!b)return alert("Book not found");
b.status="Issued";
loans.push({book:b.title,bookId:b.id,student:student.value,studentId:studentId.value,due:due.value});
localStorage.books=JSON.stringify(books);localStorage.loans=JSON.stringify(loans);
showLoans();showBooks();
}

function showLoans(){
let t="<tr><th>Book</th><th>Book ID</th><th>Student</th><th>ID</th><th>Due</th></tr>";
loans.forEach(l=>t+=`<tr><td>${l.book}</td><td>${l.bookId}</td><td>${l.student}</td><td>${l.studentId}</td><td>${l.due}</td></tr>`);
loanTable.innerHTML=t;
}

function deleteBook(){
if(!admin)return;
books=books.filter(b=>b.id!=delId.value);
localStorage.books=JSON.stringify(books);showBooks();alert("Deleted");
}

function exportCSV(){
let rows=["Book Name,Book ID,Author,ISBN,Category,Year,Publisher,Status,Description"];
books.forEach(b=>rows.push([b.title,b.id,b.author,b.isbn,b.category,b.year,b.publisher,b.status,b.description].join(",")));
loans.forEach(l=>rows.push(["LENDING",l.book,l.bookId,l.student,l.studentId,l.due]));
let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([rows.join("\n")]));a.download="Library_All_Data.csv";a.click();
}

function logout(){location.reload()}
showBooks();
